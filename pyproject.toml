[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-collaboration-harness"
version = "0.3.7"
description = "A deterministic, domain-neutral harness for bounded multi-agent collaboration."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "nokiyliao" },
]
maintainers = [
  { name = "nokiyliao" },
]
keywords = ["agents", "collaboration", "codex", "deterministic", "harness"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = []

[project.scripts]
tura-taskpacket = "codex_collaboration_harness.native_tura:main"

[project.urls]
Homepage = "https://github.com/nokiyliao/codex-collaboration-harness"
Repository = "https://github.com/nokiyliao/codex-collaboration-harness"
Issues = "https://github.com/nokiyliao/codex-collaboration-harness/issues"

[project.optional-dependencies]
dev = [
  "build==1.6.0",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
codex_collaboration_harness = [
  "agents/*.toml",
  "skills/tura-kernel/*.md",
  "skills/tura-kernel/agents/*.yaml",
  "skills/tura-kernel/references/*.md",
  "py.typed",
  "protocol/*.json",
  "protocol/golden/*.json",
]
