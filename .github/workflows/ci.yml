name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[dev]'
      - name: Run review-ready checks
        run: make check PYTHON=python
      - name: Verify installed package import
        run: make installed-smoke PYTHON=python
      - name: Build source and wheel distributions
        run: make build PYTHON=python
      - name: Verify wheel contents
        run: python -m zipfile --list dist/*.whl
