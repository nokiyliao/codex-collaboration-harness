name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and build tooling
        run: |
          python -m pip install pip==26.2.1
          python -m pip install '.[dev]'
      - name: Run review-ready checks
        run: make check PYTHON=python
      - name: Verify installed package import
        run: make installed-smoke PYTHON=python
      - name: Verify public Tura component lineage
        if: matrix.python-version == '3.12'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: make check-components PYTHON=python
      - name: Build source and wheel distributions
        if: matrix.python-version == '3.12'
        run: make build PYTHON=python
      - name: Verify clean wheel install and artifact checksums
        if: matrix.python-version == '3.12'
        run: make verify-dist PYTHON=python
