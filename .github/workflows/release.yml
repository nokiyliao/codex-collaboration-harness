name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify annotated tag and project version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          test "$(git cat-file -t "$GITHUB_REF_NAME")" = tag
          test "$(git rev-list -n 1 "$GITHUB_REF_NAME")" = "$(git rev-parse HEAD)"
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$GITHUB_REF_NAME" = "v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install pinned build tooling
        run: |
          python -m pip install pip==26.2.1
          python -m pip install '.[dev]'
      - name: Run source and public component acceptance
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          make check PYTHON=python
          make check-components PYTHON=python
      - name: Build and verify distributions
        run: |
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          make build PYTHON=python
          make verify-dist PYTHON=python
      - name: Attest release artifacts
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Publish immutable GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release already exists: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            dist/*.whl dist/*.tar.gz dist/SHA256SUMS "$ATTESTATION_BUNDLE" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
